<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none">
  <title>bq-heart-pulse / 心心脉冲</title>
  <style>
    .bq-hp-heart {
      animation: bq-hp-beat 1.6s cubic-bezier(.45,0,.55,1) infinite;
      transform-origin: 0 0; /* 锚点=心中心 */
    }
    @keyframes bq-hp-beat {
      0%        { transform: scale(1, 1); }
      12%       { transform: scale(1.15, 1.15); } /* 咚 */
      24%       { transform: scale(1, 1); }
      34%       { transform: scale(1.07, 1.07); } /* 哒 */
      46%, 100% { transform: scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bq-hp-heart { animation: none; }
    }
  </style>
  <!-- 一颗小心心咚·哒双跳（lub-dub 节律），跳完安静半拍；心宽9.4(0.39h) 高8.7 -->
  <g transform="translate(12 12.4)">
    <g class="bq-hp-heart" fill="currentColor">
      <circle cx="-2.2" cy="-1.85" r="2.5"/>
      <circle cx="2.2" cy="-1.85" r="2.5"/>
      <path d="M-4.6 -2.05 L0 4.35 L4.6 -2.05 Z"/>
    </g>
  </g>
</svg>
