<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none">
  <title>bq-sparkle-swap / 星光眨眨</title>
  <style>
    .bq-ss-a { animation: bq-ss-a 1.6s linear infinite; transform-origin: 0 0; }
    .bq-ss-b { animation: bq-ss-b 1.6s linear infinite; transform-origin: 0 0; }
    @keyframes bq-ss-a {
      0%        { opacity: 0; transform: scale(.45); }
      22%       { opacity: 1; transform: scale(1); }
      44%, 100% { opacity: 0; transform: scale(.45); }
    }
    @keyframes bq-ss-b {
      0%, 50%   { opacity: 0; transform: scale(.45); }
      72%       { opacity: 1; transform: scale(1); }
      94%, 100% { opacity: 0; transform: scale(.45); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bq-ss-a, .bq-ss-b { animation: none; }
    }
  </style>
  <!-- 一大一小两颗四角星轮流绽放消散，像眨眼；大星直径9.2(0.38h) 小星0.62倍；每0.8s一次交替 -->
  <g transform="translate(8.2 8.4)">
    <g class="bq-ss-a" fill="currentColor">
      <path d="M0 -4.6 Q1.1 -1.1 4.6 0 Q1.1 1.1 0 4.6 Q-1.1 1.1 -4.6 0 Q-1.1 -1.1 0 -4.6 Z"/>
    </g>
  </g>
  <g transform="translate(15.8 15.6) scale(.62)">
    <g class="bq-ss-b" fill="currentColor">
      <path d="M0 -4.6 Q1.1 -1.1 4.6 0 Q1.1 1.1 0 4.6 Q-1.1 1.1 -4.6 0 Q-1.1 -1.1 0 -4.6 Z"/>
    </g>
  </g>
</svg>
